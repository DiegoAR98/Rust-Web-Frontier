<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust Web Frontier - M0</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1410; overflow: hidden; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #enterOverlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(20, 15, 10, 0.85); color: #e8d9b8; font-family: system-ui, sans-serif;
        z-index: 10;
      }
      #enterOverlay button {
        font-size: 1.2rem; padding: 0.75rem 1.5rem; cursor: pointer;
        background: #6b4a2b; color: #f5e9c8; border: 1px solid #a0764a; border-radius: 4px;
      }
      #status {
        position: fixed; top: 8px; left: 8px; color: #e8d9b8; font-family: monospace;
        font-size: 12px; z-index: 5; white-space: pre;
        /* The sky is daylight now, and the ground is pale; unshadowed text on
           it was unreadable wherever the player happened to be looking. */
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      /* A swing lands on whatever the player is facing, so they have to be
         able to see where that is. Two bars rather than a dot: a dot vanishes
         against a brown crate at the exact moment it matters. */
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 18px; height: 18px;
        transform: translate(-50%, -50%); z-index: 4; pointer-events: none;
      }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: #f5e9c8;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
      }
      #crosshair::before { left: 50%; top: 0; width: 2px; height: 18px; margin-left: -1px; }
      #crosshair::after { top: 50%; left: 0; height: 2px; width: 18px; margin-top: -1px; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="status"></div>
    <div id="enterOverlay">
      <button id="enterButton">Enter world</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
